plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.iluy.klix'
    compileSdk 34

    defaultConfig {
        applicationId "com.iluy.klix"
        // minSdk/targetSdk תואמים לשעון (Android 8.1 / API 27), אותו הגיון
        // כמו בפרויקט הראשי — ראו testtap3 / iluy-v1.
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
